<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-label="ממ״ד צמוד עם קירות בטון מזוין יצוקים">
  <defs>
    <linearGradient id="skyW" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#b3cae5"/>
      <stop offset="100%" stop-color="#dde6f0"/>
    </linearGradient>
    <linearGradient id="castConcrete" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#b8b6ac"/>
      <stop offset="100%" stop-color="#7d7c72"/>
    </linearGradient>
    <linearGradient id="brandW" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0A1628"/>
      <stop offset="100%" stop-color="#1B365D"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="900" fill="url(#skyW)"/>
  <!-- left existing house (red tile roof) -->
  <g>
    <rect x="0" y="280" width="280" height="500" fill="#d4c8a8"/>
    <polygon points="0,280 140,210 280,280" fill="#a13a2a"/>
    <rect x="40" y="380" width="100" height="80" fill="#5b6a82"/>
    <rect x="40" y="380" width="100" height="80" fill="none" stroke="#fff" stroke-width="4"/>
    <rect x="170" y="380" width="80" height="60" fill="#5b6a82" opacity="0.7"/>
    <line x1="170" y1="385" x2="170" y2="445" stroke="#9aa3b0" stroke-width="3"/>
    <line x1="200" y1="385" x2="200" y2="445" stroke="#9aa3b0" stroke-width="3"/>
    <line x1="230" y1="385" x2="230" y2="445" stroke="#9aa3b0" stroke-width="3"/>
    <line x1="170" y1="385" x2="250" y2="385" stroke="#9aa3b0" stroke-width="3"/>
  </g>
  <!-- right existing house wall -->
  <g>
    <rect x="940" y="240" width="260" height="540" fill="#d4c8a8"/>
    <rect x="940" y="240" width="260" height="14" fill="#a89878"/>
    <!-- AC unit -->
    <rect x="1020" y="290" width="100" height="60" fill="#cfd5dd" stroke="#5a626d" stroke-width="3"/>
    <rect x="1030" y="300" width="80" height="40" fill="#fff"/>
    <circle cx="1070" cy="320" r="15" fill="none" stroke="#5a626d" stroke-width="3"/>
    <line x1="1070" y1="305" x2="1085" y2="320" stroke="#5a626d" stroke-width="3"/>
    <line x1="1070" y1="305" x2="1055" y2="320" stroke="#5a626d" stroke-width="3"/>
    <line x1="1070" y1="305" x2="1070" y2="335" stroke="#5a626d" stroke-width="3"/>
    <!-- roof gutter -->
    <rect x="940" y="225" width="260" height="20" fill="#e8c890"/>
  </g>
  <!-- safety railing front -->
  <g stroke="#7a808a" stroke-width="6">
    <line x1="0" y1="780" x2="1200" y2="780"/>
    <line x1="0" y1="730" x2="1200" y2="730"/>
  </g>
  <g stroke="#7a808a" stroke-width="4">
    <line x1="80" y1="730" x2="80" y2="900"/>
    <line x1="240" y1="730" x2="240" y2="900"/>
    <line x1="400" y1="730" x2="400" y2="900"/>
    <line x1="560" y1="730" x2="560" y2="900"/>
    <line x1="720" y1="730" x2="720" y2="900"/>
    <line x1="880" y1="730" x2="880" y2="900"/>
    <line x1="1040" y1="730" x2="1040" y2="900"/>
  </g>
  <!-- mamad walls cast between two houses -->
  <g>
    <!-- back wall -->
    <rect x="290" y="320" width="640" height="380" fill="url(#castConcrete)"/>
    <!-- formwork lines (horizontal seams between concrete pours / panel joints) -->
    <g stroke="#5a5a52" stroke-width="2" opacity="0.65">
      <line x1="290" y1="380" x2="930" y2="380"/>
      <line x1="290" y1="450" x2="930" y2="450"/>
      <line x1="290" y1="520" x2="930" y2="520"/>
      <line x1="290" y1="590" x2="930" y2="590"/>
      <line x1="290" y1="660" x2="930" y2="660"/>
      <!-- vertical formwork joints -->
      <line x1="380" y1="320" x2="380" y2="700"/>
      <line x1="500" y1="320" x2="500" y2="700"/>
      <line x1="620" y1="320" x2="620" y2="700"/>
      <line x1="740" y1="320" x2="740" y2="700"/>
      <line x1="850" y1="320" x2="850" y2="700"/>
    </g>
    <!-- snap-tie holes -->
    <g fill="#2a2a25">
      <circle cx="350" cy="410" r="3"/>
      <circle cx="470" cy="410" r="3"/>
      <circle cx="590" cy="410" r="3"/>
      <circle cx="710" cy="410" r="3"/>
      <circle cx="830" cy="410" r="3"/>
      <circle cx="350" cy="550" r="3"/>
      <circle cx="470" cy="550" r="3"/>
      <circle cx="590" cy="550" r="3"/>
      <circle cx="710" cy="550" r="3"/>
      <circle cx="830" cy="550" r="3"/>
    </g>
    <!-- top of wall -->
    <rect x="280" y="310" width="660" height="14" fill="#5a5a52"/>
  </g>
  <!-- Rebar starters protruding from top (for ceiling/roof slab) -->
  <g stroke="#3e2f20" stroke-width="4">
    <line x1="310" y1="320" x2="310" y2="240"/>
    <line x1="350" y1="320" x2="350" y2="225"/>
    <line x1="390" y1="320" x2="390" y2="245"/>
    <line x1="430" y1="320" x2="430" y2="230"/>
    <line x1="470" y1="320" x2="470" y2="245"/>
    <line x1="510" y1="320" x2="510" y2="225"/>
    <line x1="550" y1="320" x2="550" y2="240"/>
    <line x1="590" y1="320" x2="590" y2="225"/>
    <line x1="630" y1="320" x2="630" y2="245"/>
    <line x1="670" y1="320" x2="670" y2="230"/>
    <line x1="710" y1="320" x2="710" y2="245"/>
    <line x1="750" y1="320" x2="750" y2="225"/>
    <line x1="790" y1="320" x2="790" y2="240"/>
    <line x1="830" y1="320" x2="830" y2="225"/>
    <line x1="870" y1="320" x2="870" y2="245"/>
    <line x1="910" y1="320" x2="910" y2="230"/>
  </g>
  <!-- horizontal cap rebar curve over top -->
  <path d="M310,250 Q500,180 700,200 T910,250" fill="none" stroke="#3e2f20" stroke-width="3"/>
  <path d="M310,265 Q500,200 700,220 T910,265" fill="none" stroke="#3e2f20" stroke-width="3"/>
  <!-- electric cable hanging -->
  <path d="M620,260 Q700,300 720,400" fill="none" stroke="#1a1a1a" stroke-width="3"/>
  <!-- brand badge -->
  <g transform="translate(70,790)">
    <rect x="0" y="0" width="80" height="80" rx="14" fill="url(#brandW)"/>
    <text x="40" y="60" text-anchor="middle" font-family="Arial Hebrew, Arial, sans-serif" font-size="58" font-weight="900" fill="#E0C287">ה</text>
  </g>
</svg>
