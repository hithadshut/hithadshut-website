<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-label="מיגונית מותקנת בחצר אחורית">
  <defs>
    <linearGradient id="skyM" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bfd4ee"/>
      <stop offset="100%" stop-color="#e9eef5"/>
    </linearGradient>
    <linearGradient id="grass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5a9a4f"/>
      <stop offset="100%" stop-color="#3f7a35"/>
    </linearGradient>
    <linearGradient id="brandM" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0A1628"/>
      <stop offset="100%" stop-color="#1B365D"/>
    </linearGradient>
    <pattern id="grassDot" width="14" height="14" patternUnits="userSpaceOnUse">
      <rect width="14" height="14" fill="url(#grass)"/>
      <circle cx="2" cy="2" r="0.7" fill="#7ab86c" opacity="0.55"/>
      <circle cx="9" cy="8" r="0.7" fill="#3a6f30" opacity="0.55"/>
    </pattern>
  </defs>
  <rect width="1200" height="900" fill="url(#skyM)"/>
  <!-- back fence wall stucco -->
  <rect x="0" y="280" width="1200" height="380" fill="#b8c0cc"/>
  <rect x="0" y="280" width="1200" height="10" fill="#9aa3b0"/>
  <!-- back fence wall texture stripes -->
  <g stroke="#a8b2c1" stroke-width="1" opacity="0.5">
    <line x1="0" y1="380" x2="1200" y2="380"/>
    <line x1="0" y1="480" x2="1200" y2="480"/>
    <line x1="0" y1="580" x2="1200" y2="580"/>
  </g>
  <!-- right gate -->
  <g>
    <rect x="990" y="300" width="190" height="360" fill="#94a0b3"/>
    <g stroke="#6b7686" stroke-width="3">
      <line x1="1000" y1="320" x2="1170" y2="320"/>
      <line x1="1000" y1="380" x2="1170" y2="380"/>
      <line x1="1000" y1="440" x2="1170" y2="440"/>
      <line x1="1000" y1="500" x2="1170" y2="500"/>
      <line x1="1000" y1="560" x2="1170" y2="560"/>
      <line x1="1000" y1="620" x2="1170" y2="620"/>
    </g>
  </g>
  <!-- trees beyond fence -->
  <g opacity="0.85">
    <ellipse cx="120" cy="240" rx="160" ry="180" fill="#3f7a35"/>
    <ellipse cx="900" cy="220" rx="180" ry="200" fill="#3f7a35"/>
    <ellipse cx="500" cy="200" rx="150" ry="170" fill="#5a9a4f"/>
  </g>
  <!-- electric pole -->
  <line x1="200" y1="100" x2="200" y2="280" stroke="#3a3a3a" stroke-width="6"/>
  <line x1="180" y1="160" x2="220" y2="160" stroke="#3a3a3a" stroke-width="3"/>
  <line x1="170" y1="200" x2="230" y2="200" stroke="#3a3a3a" stroke-width="3"/>
  <line x1="100" y1="170" x2="200" y2="170" stroke="#3a3a3a" stroke-width="2"/>
  <line x1="200" y1="170" x2="320" y2="170" stroke="#3a3a3a" stroke-width="2"/>
  <!-- migunit -->
  <g>
    <!-- shadow -->
    <ellipse cx="640" cy="685" rx="220" ry="14" fill="#000" opacity="0.18"/>
    <!-- body -->
    <rect x="420" y="350" width="440" height="340" fill="#cfd7e2" stroke="#9aa3b0" stroke-width="3"/>
    <!-- top trim -->
    <rect x="420" y="342" width="440" height="18" fill="#b3bcca"/>
    <!-- door -->
    <rect x="600" y="450" width="120" height="240" fill="#d8d2c4" stroke="#a09780" stroke-width="3"/>
    <!-- door handle -->
    <circle cx="700" cy="575" r="6" fill="#5a5040"/>
    <rect x="697" y="572" width="14" height="6" fill="#5a5040"/>
    <!-- door bolts -->
    <circle cx="610" cy="465" r="3" fill="#888"/>
    <circle cx="710" cy="465" r="3" fill="#888"/>
    <circle cx="610" cy="675" r="3" fill="#888"/>
    <circle cx="710" cy="675" r="3" fill="#888"/>
    <!-- window -->
    <rect x="770" y="450" width="60" height="50" fill="#1f2c45"/>
    <rect x="770" y="450" width="60" height="50" fill="none" stroke="#5a5040" stroke-width="3"/>
    <line x1="800" y1="450" x2="800" y2="500" stroke="#5a5040" stroke-width="2"/>
    <!-- top vent -->
    <rect x="610" y="365" width="40" height="14" rx="3" fill="#7a8290"/>
    <circle cx="630" cy="372" r="5" fill="none" stroke="#3f4853" stroke-width="2"/>
  </g>
  <!-- grass foreground -->
  <rect x="0" y="660" width="1200" height="240" fill="url(#grassDot)"/>
  <!-- patio furniture left foreground (silhouette) -->
  <g fill="#3a4250" opacity="0.92">
    <rect x="40" y="700" width="220" height="40" rx="4"/>
    <rect x="40" y="730" width="20" height="80"/>
    <rect x="240" y="730" width="20" height="80"/>
    <rect x="40" y="660" width="220" height="40" rx="4" fill="#525c6d"/>
  </g>
  <!-- table foreground -->
  <g fill="#2f3640">
    <rect x="280" y="730" width="180" height="14" rx="2"/>
    <rect x="290" y="744" width="6" height="60"/>
    <rect x="442" y="744" width="6" height="60"/>
  </g>
  <!-- brand badge -->
  <g transform="translate(1090,790)">
    <rect x="0" y="0" width="80" height="80" rx="14" fill="url(#brandM)"/>
    <text x="40" y="60" text-anchor="middle" font-family="Arial Hebrew, Arial, sans-serif" font-size="58" font-weight="900" fill="#E0C287">ה</text>
  </g>
</svg>
