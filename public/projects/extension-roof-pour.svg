<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-label="יציקת תקרה בתוספת בנייה">
  <defs>
    <linearGradient id="skyR" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#b9d2eb"/>
      <stop offset="100%" stop-color="#e1eaf3"/>
    </linearGradient>
    <linearGradient id="wetConcrete" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#a8a89a"/>
      <stop offset="100%" stop-color="#7d7d70"/>
    </linearGradient>
    <linearGradient id="brandR" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0A1628"/>
      <stop offset="100%" stop-color="#1B365D"/>
    </linearGradient>
    <pattern id="aggregate" width="18" height="18" patternUnits="userSpaceOnUse">
      <rect width="18" height="18" fill="url(#wetConcrete)"/>
      <circle cx="3" cy="4" r="0.9" fill="#5a5a50" opacity="0.6"/>
      <circle cx="12" cy="9" r="1.1" fill="#5a5a50" opacity="0.6"/>
      <circle cx="6" cy="14" r="0.7" fill="#9a9a8a" opacity="0.7"/>
      <circle cx="15" cy="3" r="0.6" fill="#9a9a8a" opacity="0.7"/>
    </pattern>
  </defs>
  <rect width="1200" height="900" fill="url(#skyR)"/>
  <!-- distant tree silhouettes -->
  <g opacity="0.9">
    <ellipse cx="160" cy="240" rx="160" ry="170" fill="#3f7a35"/>
    <ellipse cx="420" cy="180" rx="180" ry="190" fill="#5a9a4f"/>
    <ellipse cx="760" cy="220" rx="170" ry="180" fill="#3f7a35"/>
    <ellipse cx="1080" cy="200" rx="160" ry="170" fill="#5a9a4f"/>
  </g>
  <!-- distant roofs -->
  <g fill="#c47a4d" opacity="0.65">
    <polygon points="0,420 220,300 440,420"/>
    <polygon points="800,400 1000,290 1200,400"/>
  </g>
  <!-- formwork plywood walls (perspective frame) -->
  <g>
    <!-- left wall -->
    <polygon points="60,420 220,400 220,820 60,860" fill="#8a6e4a"/>
    <g stroke="#5a4730" stroke-width="2" opacity="0.6">
      <line x1="60" y1="500" x2="220" y2="480"/>
      <line x1="60" y1="600" x2="220" y2="580"/>
      <line x1="60" y1="700" x2="220" y2="680"/>
      <line x1="100" y1="425" x2="100" y2="855"/>
      <line x1="160" y1="420" x2="160" y2="850"/>
    </g>
    <!-- right wall -->
    <polygon points="1140,420 980,400 980,820 1140,860" fill="#8a6e4a"/>
    <g stroke="#5a4730" stroke-width="2" opacity="0.6">
      <line x1="1140" y1="500" x2="980" y2="480"/>
      <line x1="1140" y1="600" x2="980" y2="580"/>
      <line x1="1140" y1="700" x2="980" y2="680"/>
      <line x1="1100" y1="425" x2="1100" y2="855"/>
      <line x1="1040" y1="420" x2="1040" y2="850"/>
    </g>
    <!-- back wall -->
    <rect x="220" y="400" width="760" height="50" fill="#8a6e4a"/>
  </g>
  <!-- wet concrete slab -->
  <polygon points="220,400 980,400 1100,580 100,580" fill="url(#aggregate)"/>
  <!-- footprint trowel marks -->
  <g stroke="#5a5a50" stroke-width="2" fill="none" opacity="0.4">
    <path d="M260,490 Q400,470 560,500 T900,490"/>
    <path d="M250,540 Q420,520 600,545 T960,540"/>
  </g>
  <!-- exposed rebar protruding from edges (rebar starters) -->
  <g stroke="#3a3a3a" stroke-width="3">
    <line x1="240" y1="400" x2="240" y2="350"/>
    <line x1="290" y1="400" x2="290" y2="345"/>
    <line x1="340" y1="400" x2="340" y2="350"/>
    <line x1="390" y1="400" x2="390" y2="348"/>
    <line x1="440" y1="400" x2="440" y2="346"/>
    <line x1="490" y1="400" x2="490" y2="350"/>
    <line x1="540" y1="400" x2="540" y2="344"/>
    <line x1="590" y1="400" x2="590" y2="350"/>
    <line x1="640" y1="400" x2="640" y2="346"/>
    <line x1="690" y1="400" x2="690" y2="350"/>
    <line x1="740" y1="400" x2="740" y2="345"/>
    <line x1="790" y1="400" x2="790" y2="348"/>
    <line x1="840" y1="400" x2="840" y2="350"/>
    <line x1="890" y1="400" x2="890" y2="346"/>
    <line x1="940" y1="400" x2="940" y2="350"/>
  </g>
  <!-- foreground formwork beams (looking down across) -->
  <g fill="#7a5d3f">
    <rect x="0" y="800" width="1200" height="40"/>
    <rect x="60" y="780" width="40" height="100"/>
    <rect x="200" y="780" width="40" height="100"/>
    <rect x="380" y="780" width="40" height="100"/>
    <rect x="560" y="780" width="40" height="100"/>
    <rect x="740" y="780" width="40" height="100"/>
    <rect x="920" y="780" width="40" height="100"/>
    <rect x="1100" y="780" width="40" height="100"/>
  </g>
  <g stroke="#5a4530" stroke-width="2" opacity="0.6">
    <line x1="0" y1="810" x2="1200" y2="810"/>
    <line x1="0" y1="830" x2="1200" y2="830"/>
  </g>
  <!-- brand badge -->
  <g transform="translate(1090,790)">
    <rect x="0" y="0" width="80" height="80" rx="14" fill="url(#brandR)"/>
    <text x="40" y="60" text-anchor="middle" font-family="Arial Hebrew, Arial, sans-serif" font-size="58" font-weight="900" fill="#E0C287">ה</text>
  </g>
</svg>
